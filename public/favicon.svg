<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle with Fairport Red -->
  <circle cx="16" cy="16" r="15" fill="#CC0000"/>

  <!-- Classic theater masks - overlapping comedy/tragedy -->
  <g fill="#fff">
    <!-- Comedy mask (happy) - tilted left, in front -->
    <g transform="translate(6, 8)">
      <ellipse cx="7" cy="8" rx="7" ry="8" fill="#fff"/>
      <ellipse cx="4" cy="6" rx="1.5" ry="2" fill="#CC0000"/>
      <ellipse cx="10" cy="6" rx="1.5" ry="2" fill="#CC0000"/>
      <path d="M3 10 Q7 14 11 10" fill="none" stroke="#CC0000" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Tragedy mask (sad) - tilted right, behind -->
    <g transform="translate(12, 10)">
      <ellipse cx="7" cy="8" rx="7" ry="8" fill="#fff" opacity="0.9"/>
      <ellipse cx="4" cy="6" rx="1.5" ry="2" fill="#CC0000"/>
      <ellipse cx="10" cy="6" rx="1.5" ry="2" fill="#CC0000"/>
      <path d="M3 12 Q7 9 11 12" fill="none" stroke="#CC0000" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
